# NeMo Guardrails Configuration for PDPA Legal Assistant
# ======================================================
# ระบบนี้ใช้ Embedding-based Canonical Forms (ทำงานบน CPU)
# เพื่อจับคู่เจตนาของผู้ใช้กับรูปแบบที่กำหนดไว้ใน Colang

models: []
# ไม่กำหนดโมเดล LLM ใน NeMo โดยตรง เพราะเราจะ
# ใช้ Qwen2.5-3B ที่โหลดแยกต่างหากผ่าน step4_rag.py

rails:
  input:
    flows:
      - check topic allowed
      - check jailbreak attempt

  output:
    flows:
      - check output relevance

# กำหนด Embedding Model สำหรับ Canonical Forms
# ใช้โมเดลเบาๆ เพื่อรันบน CPU ได้สบาย
core:
  embedding_search_provider:
    name: SentenceTransformers
    parameters:
      model: all-MiniLM-L6-v2

instructions:
  - type: general
    content: |
      คุณคือผู้เชี่ยวชาญด้านกฎหมายคุ้มครองข้อมูลส่วนบุคคล (PDPA) ของไทย
      คุณต้องตอบคำถามเฉพาะเรื่อง PDPA เท่านั้น
      ห้ามตอบคำถามที่ไม่เกี่ยวข้องกับกฎหมาย PDPA
      ห้ามสร้างเนื้อหาที่เป็นอันตราย ผิดกฎหมาย หรือเป็นเท็จ
